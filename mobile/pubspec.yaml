name: rezera_mobile
description: Rezera — mobile-first booking app for Uzbekistan (Flutter customer + owner).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  easy_localization: ^3.0.8
  intl: ^0.20.2
  uuid: ^4.6.0
  collection: ^1.19.1
  # 7.x pulls dart-lang jni; arm64 libdartjni.so was missing and broke all plugins.
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  sentry_flutter: ^9.6.0
  app_links: ^6.4.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/branding/
