services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rezera}
      POSTGRES_USER: ${DB_USERNAME:-rezera}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - rezera_pg:/var/lib/postgresql/data
      - ./deploy/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-btree-gist.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rezera

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rezera_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - rezera

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rezera-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      CACHE_CONFIG: ${CACHE_CONFIG:-1}
    volumes:
      - rezera_storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rezera

  worker:
    image: rezera-api:latest
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS: "0"
      CACHE_CONFIG: "0"
    volumes:
      - rezera_storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - rezera

  scheduler:
    image: rezera-api:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS: "0"
      CACHE_CONFIG: "0"
    volumes:
      - rezera_storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_started
    networks:
      - rezera

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rezera

volumes:
  rezera_pg:
  rezera_redis:
  rezera_storage:

networks:
  rezera:
    driver: bridge
